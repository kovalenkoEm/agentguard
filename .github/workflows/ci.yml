name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -e ".[dev]"

      - name: unit tests
        run: python -m pytest -q

      - name: red-team suite (scripted, no model needed)
        run: python benchmarks/run_evals.py --scripted --out /tmp/scripted.json

      - name: the guard must stop every scripted attack
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/scripted.json"))
          guard = data["asr"]["agentguard"]
          util = data["utility"]["agentguard"]
          print(f"guard ASR {guard['hit']}/{guard['total']}, utility {util['hit']}/{util['total']}")
          sys.exit(0 if guard["hit"] == 0 else 1)
          PY
